name: HRMS Automation CI

on:
  push:
    branches: ["testing"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t hrms-tests .

      - name: Run Tests in Docker
        run: docker run --rm hrms-tests